<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- caicedonia.svg — Ilustración de referencia hecha con IA: cafetal orgánico en Caicedonia con zona de camping. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B880"/>
      <stop offset="0.6" stop-color="#F7DDB8"/>
      <stop offset="1" stop-color="#F6EFE3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="600" cy="170" r="60" fill="#FBE3B5"/>
  <path d="M0 280 C140 220 260 250 400 230 C560 205 680 250 800 230 L800 600 L0 600 Z" fill="#8FA88A"/>
  <!-- Surcos de café en la ladera -->
  <path d="M0 340 C200 290 420 320 800 290 L800 600 L0 600 Z" fill="#5E8A62"/>
  <g fill="none" stroke="#3E6B47" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 22">
    <path d="M20 370 C220 330 440 355 790 325"/>
    <path d="M10 400 C220 360 440 385 790 355"/>
    <path d="M20 430 C220 390 440 415 790 385"/>
  </g>
  <!-- Plátanos (sombrío del café) -->
  <g>
    <rect x="96" y="300" width="10" height="150" fill="#6B8E4E"/>
    <g fill="#7FAF5A">
      <path d="M101 305 q-70 -10 -95 30 q50 -5 95 -30z"/><path d="M101 305 q70 -15 100 20 q-55 0 -100 -20z"/>
      <path d="M101 305 q-30 -60 -10 -95 q20 50 10 95z"/><path d="M101 305 q40 -55 80 -60 q-35 40 -80 60z"/>
    </g>
    <rect x="706" y="290" width="9" height="140" fill="#6B8E4E"/>
    <g fill="#7FAF5A">
      <path d="M710 295 q-65 -10 -90 28 q48 -5 90 -28z"/><path d="M710 295 q65 -14 92 18 q-50 0 -92 -18z"/>
      <path d="M710 295 q-28 -55 -8 -88 q18 46 8 88z"/>
    </g>
  </g>
  <!-- Carpa de camping -->
  <path d="M0 450 C220 420 520 450 800 430 L800 600 L0 600 Z" fill="#4C7A4F"/>
  <g>
    <path d="M300 470 L400 360 L500 470 Z" fill="#C56A3D"/>
    <path d="M400 360 L430 470 L500 470 Z" fill="#A4532C"/>
    <path d="M385 470 L400 405 L415 470 Z" fill="#3B2A20"/>
    <line x1="400" y1="360" x2="400" y2="345" stroke="#3B2A20" stroke-width="4"/>
  </g>
  <!-- Fogata -->
  <g transform="translate(560 470)">
    <path d="M-22 6 L22 -2 M-22 -2 L22 6" stroke="#5A3B25" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 -40 C14 -22 16 -10 0 0 C-16 -10 -12 -24 0 -40Z" fill="#E8833A"/>
    <path d="M0 -24 C7 -14 7 -6 0 0 C-7 -6 -6 -14 0 -24Z" fill="#F6C453"/>
  </g>
  <!-- Rama de café con cerezas -->
  <path d="M0 520 C260 500 540 530 800 505 L800 600 L0 600 Z" fill="#2F5D3A"/>
  <g>
    <path d="M40 600 C90 540 150 520 230 515" stroke="#5A3B25" stroke-width="6" fill="none"/>
    <g fill="#3E6B47">
      <ellipse cx="110" cy="540" rx="30" ry="12" transform="rotate(-30 110 540)"/>
      <ellipse cx="170" cy="512" rx="30" ry="12" transform="rotate(20 170 512)"/>
      <ellipse cx="215" cy="530" rx="26" ry="10" transform="rotate(-15 215 530)"/>
    </g>
    <g fill="#C0392B">
      <circle cx="130" cy="548" r="7"/><circle cx="142" cy="540" r="7"/><circle cx="136" cy="556" r="7"/>
      <circle cx="190" cy="525" r="7"/><circle cx="200" cy="517" r="6"/>
    </g>
  </g>
</svg>
