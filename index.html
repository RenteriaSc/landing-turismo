<!doctype html>
<!--
  index.html — Página única de Trendtech: conecta turistas con 3 emprendimientos del Eje Cafetero.
  Los textos fijos vienen de js/i18n.js y las tarjetas de los negocios de js/data.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trendtech — Colombia's Coffee Region</title>
  <meta name="description" content="Book directly with local families in Colombia's Coffee Region: coffee tours and farm stays in Salento, Caicedonia and Sevilla.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top-bar">
    <a class="top-bar__brand" href="#inicio">Trendtech</a>
    <div class="language-switch" role="group" aria-label="Language / Idioma">
      <button class="language-switch__button" type="button" data-language="es">ES</button>
      <button class="language-switch__button" type="button" data-language="en">EN</button>
    </div>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="hero__content">
        <p class="hero__eyebrow" data-i18n="heroEyebrow"></p>
        <h1 class="hero__title" data-i18n="heroTitle"></h1>
        <p class="hero__subtitle" data-i18n="heroSubtitle"></p>
        <a class="button button--primary" href="#emprendimientos" data-i18n="heroButton"></a>
      </div>
    </section>

    <section class="section steps" aria-labelledby="steps-title">
      <h2 class="section__title" id="steps-title" data-i18n="stepsTitle"></h2>
      <ol class="steps__list">
        <li class="step">
          <svg class="step__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
          <span class="step__number">1</span>
          <p data-i18n="step1"></p>
        </li>
        <li class="step">
          <svg class="step__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span class="step__number">2</span>
          <p data-i18n="step2"></p>
        </li>
        <li class="step">
          <svg class="step__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/></svg>
          <span class="step__number">3</span>
          <p data-i18n="step3"></p>
        </li>
      </ol>
    </section>

    <section class="section businesses" id="emprendimientos" aria-labelledby="businesses-title">
      <h2 class="section__title" id="businesses-title" data-i18n="businessesTitle"></h2>
      <p class="section__lead" data-i18n="businessesLead"></p>
      <div class="businesses__grid" id="business-list"></div>
    </section>

    <section class="section about" aria-labelledby="about-title">
      <h2 class="section__title" id="about-title" data-i18n="aboutTitle"></h2>
      <p class="about__text" data-i18n="aboutText"></p>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__brand">Trendtech</p>
    <p data-i18n="footerTeam"></p>
    <p data-i18n="footerCourse"></p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
